name: Deploy to GitHub Pages
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run build
      # Guest build sits beside the root site. Relative ./assets keep working
      # at /get-off-my-lawn/crazygames/ and do not replace dist/index.html.
      - run: npm run build:crazygames
      - run: rm -rf dist/crazygames && mkdir -p dist/crazygames && cp -a dist-crazygames/. dist/crazygames/
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
